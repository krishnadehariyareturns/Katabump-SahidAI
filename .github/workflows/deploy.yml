name: Deploy to Katabump

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USER: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp openssh-client

      - name: Trust SFTP host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASS" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set ssl:verify-certificate no
          set xfer:clobber on

          mirror -R \
            --verbose \
            --only-newer \
            --no-perms \
            --exclude-glob .git \
            --exclude-glob .github \
            --exclude-glob node_modules \
            --exclude-glob .env \
            --exclude-glob README.md \
            ./ /

          bye
          EOF
